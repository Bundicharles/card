<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    font-family:Arial,sans-serif;
    padding:20px;
}

/* CARD */
.card{
    position:relative;
    width:420px;
    height:300px;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        -45deg,
        #f89b29 0%,
        #ff0f7b 100%
    );

    transition:all .6s cubic-bezier(.23,1,.32,1);
    -webkit-tap-highlight-color:transparent;
}

/* ICON */
.icon{
    font-size:60px;
    transition:all .6s cubic-bezier(.23,1,.32,1);
}

/* OPEN EFFECT */
.card:hover,
.card.active{
    transform:rotate(-4deg) scale(1.05);
    box-shadow:
        0 20px 40px rgba(0,0,0,.35);
}

/* CONTENT PANEL */
.card-content{
    position:absolute;
    inset:0;

    background:white;
    padding:28px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;
    transform:rotate(-45deg) scale(.8);

    transition:all .6s cubic-bezier(.23,1,.32,1);

    overflow-y:auto;
}

/* SHOW CONTENT */
.card:hover .card-content,
.card.active .card-content{
    opacity:1;
    transform:rotate(0deg) scale(1);
}

/* HIDE ICON */
.card:hover .icon,
.card.active .icon{
    transform:rotate(-45deg) scale(0);
    opacity:0;
}

.title{
    font-size:26px;
    font-weight:700;
    color:#222;
    margin-bottom:14px;
}

.description{
    font-size:15px;
    line-height:1.7;
    color:#00000c;
    max-width:100%;
}

/* CUSTOM SCROLLBAR */
.card-content::-webkit-scrollbar{
    width:6px;
}

.card-content::-webkit-scrollbar-thumb{
    background:#ff0f7b;
    border-radius:20px;
}

.card-content::-webkit-scrollbar-track{
    background:transparent;
}

/* MOBILE */
@media(max-width:480px){

    .card{
        width:95%;
        height:320px;
    }

    .title{
        font-size:22px;
    }

    .description{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="card" id="loveCard">

    <div class="icon"></div>

    <div class="card-content">

        <h2 class="title">
            Blog Card
        </h2>

        <p class="description">
           you always have a such great looks.I'd be lucky to get a photo when you have a moment
            
        </p>

    </div>

</div>

<script>

const card = document.getElementById("loveCard");

card.addEventListener("click", () => {
    card.classList.toggle("active");
});

</script>

</body>
</html>
