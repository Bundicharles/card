<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    padding:20px;

    /* PAGE BACKGROUND IMAGE */
    background-image: url('https://i.pinimg.com/736x/8f/dc/fb/8fdcfb1af41d914fd6c19649d5d196bb.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* Page overlay for better contrast */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 0;
}

/* CARD */
.card{
    position:relative;
    width:420px;
    height:300px;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    /* CARD BACKGROUND IMAGE */
    background-image: url('https://i.pinimg.com/736x/3a/33/9a/3a339ab973f55e570c165fab5f2dc12f.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    transition:all .6s cubic-bezier(.23,1,.32,1);
    -webkit-tap-highlight-color:transparent;
    z-index: 1;
}

/* Card overlay for better icon readability */
.card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.3);
    transition: all .6s cubic-bezier(.23,1,.32,1);
    z-index: 1;
}

.card:hover::before,
.card.active::before {
    background: rgba(0, 0, 0, 0.5);
}

/* ICON */
.icon{
    font-size:60px;
    transition:all .6s cubic-bezier(.23,1,.32,1);
    position: relative;
    z-index: 2;
}

/* OPEN EFFECT */
.card:hover,
.card.active{
    transform:rotate(-4deg) scale(1.05);
    box-shadow:
        0 20px 40px rgba(0,0,0,.35);
}

/* CONTENT PANEL */
.card-content{
    position:absolute;
    inset:0;

    background:rgba(2, 0, 0, 0.95);
    padding:28px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    opacity:0;
    transform:rotate(-45deg) scale(.8);

    transition:all .6s cubic-bezier(.23,1,.32,1);

    overflow-y:auto;
    z-index: 3;
}

/* SHOW CONTENT */
.card:hover .card-content,
.card.active .card-content{
    opacity:1;
    transform:rotate(0deg) scale(1);
}

/* HIDE ICON */
.card:hover .icon,
.card.active .icon{
    transform:rotate(-45deg) scale(0);
    opacity:0;
    
}

.title{
    font-size:26px;
    font-weight:700;
    color:#f80606;
    margin-bottom:14px;
}

.description{
    font-size:15px;
    line-height:1.7;
    color:#ededf0;
    max-width:100%;
}

/* CUSTOM SCROLLBAR */
.card-content::-webkit-scrollbar{
    width:6px;
}

.card-content::-webkit-scrollbar-thumb{
    background:#ff0f7b;
    border-radius:20px;
}

.card-content::-webkit-scrollbar-track{
    background:transparent;
}

/* MOBILE */
@media(max-width:480px){

    .card{
        width:95%;
        height:320px;
    }

    .title{
        font-size:22px;
    }

    .description{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="card" id="loveCard">

    <div class="icon">👆</div>

    <div class="card-content">

        <h2 class="title">
            Blog Card
        </h2>

        <p class="description">
           You always have such great looks. I'd be lucky to get a photo when you have a moment.
        </p>

    </div>

</div>

<script>

const card = document.getElementById("loveCard");

card.addEventListener("click", () => {
    card.classList.toggle("active");
});

</script>

</body>
</html>
